<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Depths of Sosaria — UOスキル制×パーティ制ダンジョンクローラー</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="wrap">
  <div id="gameArea">
    <canvas id="cv" width="960" height="520"></canvas>

    <div id="hud">
      <div id="depthLabel"></div>
      <div id="goldLabel"></div>
      <div id="turnLabel"></div>
      <div id="sneakLabel"></div>
    </div>

    <div id="help">移動:WASD/矢印(1歩=1ターン) ・ E:調べる(階段▼▲/宝箱📦/鉱脈◆) ・ R:休息 ・ B:包帯 ・ H:隠密 ・ 1-6:キャラ ・ Esc:閉じる</div>

    <div id="charPanel" class="panel hidden"></div>

    <div id="campScreen" class="screen hidden"></div>
    <div id="titleScreen" class="screen"></div>
    <div id="wipeScreen" class="screen hidden"></div>
    <div id="battleScreen" class="screen hidden"></div>
  </div>
  <div id="partyHud"></div>
  <div id="log"></div>
</div>

<script src="js/rng.js"></script>
<script src="js/data.js"></script>
<script src="js/skills.js"></script>
<script src="js/items.js"></script>
<script src="js/dungeon.js"></script>
<script src="js/entities.js"></script>
<script src="js/battle.js"></script>
<script src="js/crafting.js"></script>
<script src="js/save.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
